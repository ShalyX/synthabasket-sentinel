name: Sentinel independent build and policy checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Sentinel data and guard tests
        run: npx tsx --test src/lib/sentinel/*.test.ts
      - name: Agentic Wallet read-only adapter tests
        run: node --test scripts/agentic-wallet-readonly.test.mjs scripts/agentic-wallet-diagnostic.test.mjs
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
